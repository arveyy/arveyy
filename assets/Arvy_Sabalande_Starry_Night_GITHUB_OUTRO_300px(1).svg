<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="300" preserveAspectRatio="none">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#090909"/><stop offset=".5" stop-color="#202020"/><stop offset="1" stop-color="#050505"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="white"/><stop offset=".68" stop-color="white"/><stop offset="1" stop-color="black"/>
  </linearGradient>
  <mask id="topFade"><rect width="900" height="180" fill="url(#fade)"/></mask>
  <clipPath id="waveClip">
    <path d="M0 58
      C80 44 155 60 245 48
      C335 36 420 57 505 48
      C610 37 700 53 790 44
      C835 40 870 45 900 38
      V180H0Z"/>
  </clipPath>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs><g transform="scale(1 1.6666667)">

<g mask="url(#topFade)" clip-path="url(#waveClip)">
  <rect width="900" height="180" fill="url(#sky)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-30 80 C120 10 245 34 350 82 S620 156 930 60" stroke="#aaa" stroke-width="14" opacity=".22">
      <animateTransform attributeName="transform" type="translate" values="0 0;-18 4;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M-20 112 C130 55 260 70 370 112 S640 164 930 92" stroke="#fff" stroke-width="5" opacity=".26">
      <animateTransform attributeName="transform" type="translate" values="0 0;16 -3;0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M180 35 C260 72 320 48 390 22 C465 -5 540 10 600 48" stroke="#ddd" stroke-width="7" opacity=".18">
      <animateTransform attributeName="transform" type="rotate" values="0 450 75;-2 450 75;0 450 75" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#fff">
    <circle cx="90" cy="91" r="2"/><circle cx="205" cy="68" r="2.2"/>
    <circle cx="315" cy="96" r="1.7"/><circle cx="440" cy="62" r="2"/>
    <circle cx="555" cy="92" r="2.3"/><circle cx="665" cy="65" r="1.8"/>
    <circle cx="765" cy="98" r="2.2"/><circle cx="850" cy="68" r="1.7"/>
  </g>

  <circle cx="770" cy="91" r="33" fill="#aaa" opacity=".20" filter="url(#glow)"/>
  <circle cx="770" cy="91" r="24" fill="#eee"/>
</g>

<path d="M0 50 C105 36 180 54 280 43 S470 52 580 45 S780 34 900 47"
      fill="none" stroke="#fff" stroke-opacity=".20" stroke-width="9">
  <animateTransform attributeName="transform" type="translate" values="25 0;-25 0;25 0" dur="9s" repeatCount="indefinite"/>
</path>
<path d="M0 63 C110 48 205 66 305 55 S500 66 625 56 S805 48 900 58"
      fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="6">
  <animateTransform attributeName="transform" type="translate" values="-20 0;20 0;-20 0" dur="11s" repeatCount="indefinite"/>
</path>
</g></svg>