<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
<defs>
  <linearGradient id="sky" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#050505"/><stop offset=".35" stop-color="#171717"/>
    <stop offset=".68" stop-color="#404040"/><stop offset="1" stop-color="#080808"/>
  </linearGradient>
  <radialGradient id="moonGlow"><stop stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="silver"><stop stop-color="#888"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#999"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  <mask id="waveFadeTop">
    <path d="M0 48 C85 25 155 66 250 43 S430 23 525 48 S710 72 900 40 L900 300 L0 300Z" fill="white"/>
  </mask>
</defs>

<rect width="900" height="300" fill="url(#sky)"/>

<g fill="none" stroke-linecap="round">
  <path d="M-50 91 C90 22 210 165 335 94 S620 25 950 100"
        stroke="#333" stroke-width="46" opacity=".9">
    <animateTransform attributeName="transform" type="rotate"
      values="1 450 105;-1 450 105;1 450 105" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M-50 130 C110 65 205 200 350 125 S620 68 950 140"
        stroke="#5b5b5b" stroke-width="27"/>
  <path d="M-40 165 C90 108 185 218 305 165 S520 125 625 177 S800 200 940 155"
        stroke="#1b1b1b" stroke-width="19"/>
  <path d="M10 190 C120 130 190 230 300 175 S500 145 605 194 S790 220 930 170"
        stroke="url(#silver)" stroke-width="4" opacity=".85">
    <animateTransform attributeName="transform" type="rotate"
      values="0 450 175;-2 450 175;0 450 175;2 450 175;0 450 175" dur="8s" repeatCount="indefinite"/>
  </path>
</g>

<g fill="#fff">
  <circle cx="92" cy="92" r="3"/><circle cx="185" cy="125" r="2"/>
  <circle cx="320" cy="85" r="3"/><circle cx="520" cy="115" r="2"/>
  <circle cx="665" cy="80" r="3"/><circle cx="825" cy="120" r="2"/>
</g>

<circle cx="760" cy="116" r="38" fill="url(#moonGlow)" filter="url(#blur)"/>
<circle cx="760" cy="116" r="17" fill="#f4f4f4"/>

<!-- complementary wavy transparent top end -->
<g mask="url(#waveFadeTop)">
  <path d="M-20 45 C90 15 165 72 270 42 S455 15 550 48 S740 72 930 36"
        fill="none" stroke="#111" stroke-width="62">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-18 3;0 0;18 -3;0 0" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M-20 50 C110 25 170 65 280 45 S450 28 555 52 S760 70 930 40"
        fill="none" stroke="#666" stroke-width="16"/>
  <path d="M-20 48 C110 24 180 60 280 40 S450 25 555 49 S760 66 930 37"
        fill="none" stroke="#eee" stroke-width="3" opacity=".85"/>
</g>
</svg>